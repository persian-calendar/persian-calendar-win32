name: Build EXE

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'
  pull_request:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 0
      - name: Check for changes since the latest stable release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stable_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$stable_tag" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stable_commit=$(git rev-list -n 1 "$stable_tag")
          if git diff --quiet "$stable_commit" "$GITHUB_SHA" --; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  upload-exe:
    needs: check-changes
    if: needs.check-changes.outputs.should_publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Cache LLVM Installer
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: LLVM-22.1.8-win64.exe
          key: llvm-installer-22.1.8
      - name: Download LLVM Installer
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          curl -L -o LLVM-22.1.8-win64.exe https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-win64.exe
      - name: Install LLVM
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ".\LLVM-22.1.8-win64.exe" -ArgumentList "/S" -PassThru
          $p.WaitForExit()
      - name: Run the tests
        shell: cmd
        run: |
          "C:\\Program Files\\LLVM\\bin\\clang" test.cc -m32 -fno-exceptions -D_CRT_SECURE_NO_WARNINGS -o test.exe && test.exe

      - name: Build EXE
        shell: cmd
        run: |
          build.bat

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pefile
          python postlink.py

      - name: Publish latest prerelease
        if: github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release edit latest --title "Latest build" --prerelease
          } else {
            gh release create latest --title "Latest build" --notes "" --target $env:GITHUB_SHA --prerelease
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload latest PersianCalendar.exe PersianCalendarInstaller.exe --clobber

      - name: Publish daily stable release
        if: github.event_name == 'schedule'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $persianCalendar = [System.Globalization.PersianCalendar]::new()
          $now = [DateTime]::UtcNow
          $year = $persianCalendar.GetYear($now)
          $month = $persianCalendar.GetMonth($now)
          $day = $persianCalendar.GetDayOfMonth($now)
          $shortYear = $year % 100
          $tagName = "v$shortYear.$month.$day"

          gh release view $tagName *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tagName --title "$tagName" --notes "$tagName" --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            gh release upload $tagName PersianCalendar.exe PersianCalendarInstaller.exe --clobber
          }
