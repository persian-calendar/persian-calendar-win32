name: Build EXE

permissions:
  contents: write

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'
  pull_request:

jobs:
  check-changes:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'schedule'
        with:
          fetch-depth: 0
      - name: Check for changes since the latest stable release
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stable_tag=$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')
          if [ -z "$stable_tag" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stable_commit=$(git rev-list -n 1 "$stable_tag")
          if git diff --quiet "$stable_commit" "$GITHUB_SHA" --; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  upload-exe:
    needs: check-changes
    if: needs.check-changes.outputs.should_publish == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Get Latest LLVM Version
        id: llvm-version
        shell: pwsh
        run: |
          $headers = @{ Authorization = "token ${{ github.token }}" }
          $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/llvm/llvm-project/releases?per_page=10" -Headers $headers
          $release = $releases | Where-Object { $_.tag_name -like "llvmorg-*" -and $_.prerelease -eq $false } | Select-Object -First 1

          $tagName = $release.tag_name
          $version = $tagName -replace "^llvmorg-", ""

          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT
          Write-Host "Found LLVM Version: $version ($tagName)"

      - name: Cache LLVM Installer
        id: cache-llvm
        uses: actions/cache@v6
        with:
          path: llvm-installer.msi
          key: llvm-installer-${{ steps.llvm-version.outputs.VERSION }}

      - name: Download LLVM Installer
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $version = "${{ steps.llvm-version.outputs.VERSION }}"
          $tagName = "${{ steps.llvm-version.outputs.TAG_NAME }}"
          $url = "https://github.com/llvm/llvm-project/releases/download/$tagName/LLVM-$version-win64.msi"
          Invoke-WebRequest -Uri $url -OutFile llvm-installer.msi

      - name: Install LLVM
        shell: pwsh
        run: |
          Start-Process msiexec.exe -ArgumentList "/i llvm-installer.msi /quiet /norestart" -Wait

      - name: Run the tests
        shell: cmd
        run: |
          "C:\\Program Files\\LLVM\\bin\\clang" test.cc -m32 -fno-exceptions -D_CRT_SECURE_NO_WARNINGS -o test.exe && test.exe

      - name: Determine Version
        id: version
        shell: pwsh
        run: |
          $persianCalendar = [System.Globalization.PersianCalendar]::new()
          $now = [DateTime]::UtcNow
          $year = $persianCalendar.GetYear($now)
          $month = $persianCalendar.GetMonth($now)
          $day = $persianCalendar.GetDayOfMonth($now)
          $shortYear = $year % 100

          if ("${{ github.event_name }}" -eq "schedule") {
            $v = "$shortYear.$month.$day.0"
            $tagName = "v$shortYear.$month.$day"
          } else {
            $v = "$shortYear.$month.$day.1"
            $tagName = "latest"
          }
          echo "VERSION=$v" >> $env:GITHUB_OUTPUT
          echo "TAG_NAME=$tagName" >> $env:GITHUB_OUTPUT

      - name: Update Resource File Version
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.VERSION }}"
          $commaVer = $ver -replace '\.', ','

          $rcPath = "setup.rc"
          $content = Get-Content $rcPath -Raw

          $content = [System.Text.RegularExpressions.Regex]::Replace($content, 'FILEVERSION\s+[\d,]+', "FILEVERSION    $commaVer")
          $content = [System.Text.RegularExpressions.Regex]::Replace($content, 'PRODUCTVERSION\s+[\d,]+', "PRODUCTVERSION $commaVer")
          $content = [System.Text.RegularExpressions.Regex]::Replace($content, 'VALUE "FileVersion",\s+"[\d\.]+"', "VALUE ""FileVersion"",     ""$ver""")
          $content = [System.Text.RegularExpressions.Regex]::Replace($content, 'VALUE "ProductVersion",\s+"[\d\.]+"', "VALUE ""ProductVersion"",  ""$ver""")

          Set-Content -Path $rcPath -Value $content -NoNewline
          Write-Host "Updated $rcPath to version $ver"

      - name: Build EXE
        shell: cmd
        run: |
          build.bat

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pefile
          python postlink.py

      - name: Cache UPX
        id: cache-upx
        uses: actions/cache@v4
        with:
          path: upx-5.2.1-win32.zip
          key: upx-5.2.1-win32
      - name: Download UPX
        if: steps.cache-upx.outputs.cache-hit != 'true'
        run: |
          curl -L -o upx-5.2.1-win32.zip https://github.com/upx/upx/releases/download/v5.2.1/upx-5.2.1-win32.zip
      - name: Extract UPX
        shell: pwsh
        run: |
          Expand-Archive upx-5.2.1-win32.zip -DestinationPath upx_tmp -Force
          Get-ChildItem -Recurse upx_tmp -Filter upx.exe | Select-Object -First 1 | Copy-Item -Destination .
          Remove-Item upx_tmp -Recurse -Force
      - name: Build UPX EXE
        shell: cmd
        run: |
          upx.exe --ultra-brute setup.exe

      - name: Commit and Push Updated Resource File
        shell: pwsh
        run: |
          $tagName = "${{ steps.version.outputs.TAG_NAME }}"
          if ($tagName -ne "latest") {
            git config --local user.name "github-actions[bot]"
            git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add setup.rc
            git diff --staged --quiet
            if ($LASTEXITCODE -ne 0) {
              git commit -m "Update setup.rc version to ${{ steps.version.outputs.VERSION }}"
              git pull --rebase origin main
              git push
            }
          }

      - name: Publish Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tagName = "${{ steps.version.outputs.TAG_NAME }}"

          gh release view $tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            if ($tagName -eq "latest") {
              gh release edit latest --title "Latest build" --prerelease
            }
          } else {
            if ($tagName -eq "latest") {
              gh release create latest --title "Latest build" --notes "" --target $env:GITHUB_SHA --prerelease
            } else {
              gh release create $tagName --title "$tagName" --notes "$tagName" --target $env:GITHUB_SHA
            }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tagName PersianCalendar.exe setup.exe --clobber